spring.application.name=server

# The database. The password is NOT here - see application-local.properties,
# which is never committed (SEC-4).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lll_print?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kuala_Lumpur
spring.datasource.username=lll_print
spring.config.import=optional:classpath:application-local.properties

# Flyway owns the database's structure. Hibernate never changes it; it only
# checks that what it expects is what is there.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Money is whole sen and dates are the shop's own day (NFR-2.3, NFR-2.4).
spring.jackson.time-zone=Asia/Kuala_Lumpur

# Signing in. The secret that signs the session token is NOT here; it lives in
# application-local.properties, which is never committed, and the server refuses
# to start without it (SEC-4, SEC-6). How long a session lasts is not a secret.
lllprint.sign-in.session-length=12h

# Spring Boot would otherwise make a default user of its own, with a password it
# prints at startup. The only accounts in this system are the shop staff
# accounts, so that is switched off (SEC-1).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
