spring.application.name=server

# The database. The password is NOT here - see application-local.properties,
# which is never committed (SEC-4).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lll_print?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kuala_Lumpur
spring.datasource.username=lll_print
spring.config.import=optional:classpath:application-local.properties

# Flyway owns the database's structure. Hibernate never changes it; it only
# checks that what it expects is what is there.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Money is whole sen and dates are the shop's own day (NFR-2.3, NFR-2.4).
spring.jackson.time-zone=Asia/Kuala_Lumpur
